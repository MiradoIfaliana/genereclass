<section>
    <h1>personne</h1>
    <button class="bt-crud" (click)="popopSave()">CREATE</button>
    
    <button class="bt-crud" (click)="popopListe()">LISTE</button>

    <div class="custom-popo-save" [ngClass]="{'active': popoActiveSave}" >
        <form  #personneForm="ngForm" (ngSubmit)="submitFormCreate(personneForm)" >
            <h2>Save personne</h2>

            <input type="hidden" id="idpersonne" name="idpersonne" [value]="0" ngModel/><br> 
            <label for="nompersonne">Nompersonne: </label><br>
            <input type="text" id="nompersonne" name="nompersonne" ngModel/>
            <br>
            <label for="nee">Nee: </label><br>
            <input type="datetime-local" id="nee" name="nee" ngModel/>
            <br>
            <label for="sexe">Sexe: </label><br>
            <input type="text" id="sexe" name="sexe" ngModel/>
            <br>


            <button type="submit">Valider</button>
        </form>
    </div>

    <div class="custom-popo-update" [ngClass]="{'active': popoActiveUpdate}" >
        <form  *ngIf="personne" (ngSubmit)="submitFormUpdate()">
            <h2>Update personne</h2>

            <input type="hidden" id="idpersonne" name="idpersonne" [(ngModel)]="personne.idpersonne"><br> 
            <label for="nompersonne">Nompersonne: </label><br>
            <input type="text" id="nompersonne" [(ngModel)]="personne.nompersonne" name="nompersonne" />
            <br>
            <label for="nee">Nee: </label><br>
            <input type="datetime-local" id="nee" [(ngModel)]="personne.nee" name="nee" />
            <br>
            <label for="sexe">Sexe: </label><br>
            <input type="text" id="sexe" [(ngModel)]="personne.sexe" name="sexe" />
            <br>

            
            <button type="submit">Valider</button>
        </form>
    </div>

    <div class="custom-popo-liste" [ngClass]="{'active': popoActiveListe}" >     
            <table>
                
                <thead>
                    <h2>Liste personne </h2>
                    <tr>
                        <th>idpersonne</th>
                        <th>nompersonne</th>
                        <th>nee</th>
                        <th>sexe</th>

                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let personne of personnes">
                        <td>{{personne.idpersonne}}</td>
                        <td>{{personne.nompersonne}}</td>
                        <td>{{personne.nee}}</td>
                        <td>{{personne.sexe}}</td>

                        <td class="td-ud"><button class="bt-crud" class="bt-up" (click)="popopUpdate(personne.idpersonne)">UPDATE</button></td>
                        <td class="td-ud"><button class="bt-crud" class="bt-del" (click)="delete(personne.idpersonne)">DELETE</button></td>
                    </tr>
                </tbody>
            </table>
    </div>
          
</section>
